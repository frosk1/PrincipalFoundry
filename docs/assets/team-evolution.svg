<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Traditional software team to Principal Engineering Team</title>
<desc id="desc">Comparison of a traditional software team with a future Principal Engineering Team where one or two senior engineers orchestrate an architect agent and a software factory of implementation, tester, reviewer and automation agents.</desc>
<defs>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#10b981"/></marker>
  <style>
    .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}
    .muted{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#64748b}
    .box{stroke:#cbd5e1;stroke-width:2}
    .small{font-size:20px}.mid{font-size:24px}.head{font-size:34px;font-weight:800}.role{font-size:23px;font-weight:800}
  </style>
</defs>
<rect width="1600" height="900" fill="#fff"/>
<line x1="790" y1="45" x2="790" y2="855" stroke="#e2e8f0" stroke-width="3"/>
<rect x="210" y="28" width="210" height="72" rx="24" fill="#eff6ff"/><text x="315" y="78" text-anchor="middle" class="t head">Before</text>
<text x="395" y="145" text-anchor="middle" class="t head">Traditional Software Team</text>
<text x="395" y="183" text-anchor="middle" class="muted small">Multiple roles, many people, higher coordination overhead.</text>
<g>
  <rect x="70" y="230" width="300" height="120" rx="18" fill="#eff6ff" class="box"/><text x="220" y="275" text-anchor="middle" class="t role">Product Owner</text><text x="220" y="310" text-anchor="middle" class="muted small">Vision · priorities · requirements</text>
  <rect x="420" y="230" width="300" height="120" rx="18" fill="#f5f3ff" class="box"/><text x="570" y="275" text-anchor="middle" class="t role">Architect</text><text x="570" y="310" text-anchor="middle" class="muted small">System architecture · technical direction</text>
  <path d="M220 350v65h350v-65M395 415v35" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <rect x="70" y="450" width="300" height="135" rx="18" fill="#ecfeff" class="box"/><text x="220" y="495" text-anchor="middle" class="t role">Backend Engineers</text><text x="220" y="530" text-anchor="middle" class="muted small">APIs · services · data layer</text><text x="220" y="565" text-anchor="middle" class="t mid">● ● ●</text>
  <rect x="420" y="450" width="300" height="135" rx="18" fill="#ecfeff" class="box"/><text x="570" y="495" text-anchor="middle" class="t role">Frontend Engineers</text><text x="570" y="530" text-anchor="middle" class="muted small">UI · applications · client logic</text><text x="570" y="565" text-anchor="middle" class="t mid">● ● ●</text>
  <path d="M220 585v55M570 585v55" stroke="#94a3b8" stroke-width="3"/>
  <rect x="70" y="640" width="300" height="120" rx="18" fill="#f0fdfa" class="box"/><text x="220" y="685" text-anchor="middle" class="t role">QA</text><text x="220" y="720" text-anchor="middle" class="muted small">Testing · regression · bug finding</text>
  <rect x="420" y="640" width="300" height="120" rx="18" fill="#f0fdfa" class="box"/><text x="570" y="685" text-anchor="middle" class="t role">DevOps</text><text x="570" y="720" text-anchor="middle" class="muted small">Infrastructure · deploy · monitoring</text>
</g>
<path d="M750 440h75" stroke="#cbd5e1" stroke-width="12" marker-end="url(#arrowBlue)"/>
<rect x="1045" y="28" width="210" height="72" rx="24" fill="#ecfdf5"/><text x="1150" y="78" text-anchor="middle" class="t head">Future</text>
<text x="1195" y="145" text-anchor="middle" class="t head">Principal Engineering Team</text>
<text x="1195" y="183" text-anchor="middle" class="muted small">1–2 senior engineers orchestrate an AI coding workforce.</text>
<rect x="830" y="210" width="720" height="610" rx="28" fill="#f0fdfa" stroke="#10b981" stroke-width="4"/>
<text x="1190" y="255" text-anchor="middle" class="t head">Software Factory</text>
<text x="1190" y="287" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#047857">Architecture / product direction loops with implementation agents</text>
<rect x="865" y="320" width="300" height="135" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
<text x="1015" y="360" text-anchor="middle" class="t role">Senior Engineer</text><text x="1015" y="395" text-anchor="middle" class="muted small">Sets direction · reviews output</text><text x="1015" y="425" text-anchor="middle" class="muted small">Owns product & engineering judgment</text>
<rect x="1210" y="320" width="300" height="135" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
<text x="1360" y="360" text-anchor="middle" class="t role">Architect Agent</text><text x="1360" y="395" text-anchor="middle" class="muted small">Architecture · task decomposition</text><text x="1360" y="425" text-anchor="middle" class="muted small">Feedback loop with execution agents</text>
<path d="M1165 375h45" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/><path d="M1210 405h-45" stroke="#10b981" stroke-width="4" marker-end="url(#arrowGreen)"/>
<rect x="1040" y="500" width="300" height="62" rx="20" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="1190" y="540" text-anchor="middle" class="t role">Git / Repository Control Plane</text>
<path d="M1015 455v62h25M1360 455v62h-20" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
<g>
  <rect x="850" y="620" width="160" height="145" rx="18" fill="#fff" stroke="#99f6e4" stroke-width="2"/><text x="930" y="665" text-anchor="middle" class="t role">Implementer</text><text x="930" y="695" text-anchor="middle" class="t role">Agents</text><text x="930" y="730" text-anchor="middle" class="muted small">Build code</text>
  <rect x="1025" y="620" width="160" height="145" rx="18" fill="#fff" stroke="#99f6e4" stroke-width="2"/><text x="1105" y="665" text-anchor="middle" class="t role">Tester</text><text x="1105" y="695" text-anchor="middle" class="t role">Agents</text><text x="1105" y="730" text-anchor="middle" class="muted small">Falsify behavior</text>
  <rect x="1200" y="620" width="160" height="145" rx="18" fill="#fff" stroke="#99f6e4" stroke-width="2"/><text x="1280" y="665" text-anchor="middle" class="t role">Reviewer</text><text x="1280" y="695" text-anchor="middle" class="t role">Agents</text><text x="1280" y="730" text-anchor="middle" class="muted small">Review change</text>
  <rect x="1375" y="620" width="160" height="145" rx="18" fill="#fff" stroke="#99f6e4" stroke-width="2"/><text x="1455" y="665" text-anchor="middle" class="t role">CI /</text><text x="1455" y="695" text-anchor="middle" class="t role">Automation</text><text x="1455" y="730" text-anchor="middle" class="muted small">Verify & deploy</text>
</g>
<path d="M1190 562v25H930v33M1190 587h-85v33M1190 587h90v33M1190 587h265v33" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
<path d="M930 620C900 545 915 480 865 430" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
<text x="865" y="525" class="t small" fill="#2563eb">direction & priorities</text>
<path d="M1455 620C1525 560 1530 485 1510 420" fill="none" stroke="#10b981" stroke-width="4" marker-end="url(#arrowGreen)"/>
<text x="1390" y="520" class="t small" fill="#047857">results & feedback</text>
</svg>